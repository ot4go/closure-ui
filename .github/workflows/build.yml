name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: .build/go.mod
          cache-dependency-path: .build/go.sum

      - run: go -C .build run ./build

      # The docs are not automatic — this makes them: the build regenerates
      # README.md, AGENTS.md and doc/ from their sources; any drift means
      # someone edited an artifact (or forgot to run the build) — fail here.
      - run: git diff --exit-code

      - uses: actions/upload-artifact@v5
        with:
          name: closure-ui
          path: |
            release/closure-ui.js
            release/closure-ui.min.js
            release/closure-ui.md
