name: Release

# Tag-driven: pushing a v* tag IS the release — and the tag must sit on
# main. The manifest (.build/next-release.json) must agree with the pushed
# tag — it still carries the title and drives the versioned packaging — so
# a tag cannot ship without its manifest bump.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write # npm --provenance: verifiable build attestation via OIDC

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # main is needed for the on-main ancestry check

      - name: Check the tag sits on main and matches the manifest
        id: man
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad tag: $tag"; exit 1; }
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$tag is not on main — releases ship from main only"
            exit 1
          fi
          mtag=$(jq -r .tag .build/next-release.json)
          title=$(jq -r '.title // empty' .build/next-release.json)
          if [[ "$tag" != "$mtag" ]]; then
            echo "::error::pushed tag $tag != manifest tag $mtag — bump .build/next-release.json first"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=${title:-$tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version-file: .build/go.mod
          cache-dependency-path: .build/go.sum

      - name: Check the tag matches the config
        # the config owns the release number; the manifest and git only
        # consume it — a tag the config did not declare is refused at the
        # door (the mkskill version is the one .build/go.mod pins)
        run: |
          want="$(go -C .build run github.com/pablo-botella/mkskill/cmd/mkskill -q -C .. -vout version)"
          [ "$want" = "$GITHUB_REF_NAME" ] || {
            echo "::error::config says $want, tag is $GITHUB_REF_NAME"; exit 1; }

      # `release` is the only mode that emits versioned artifacts; it
      # verifies the tag it runs on.
      - run: go -C .build run ./release

      # the release build just regenerated the tracked docs from their
      # sources; any drift means a stale committed artifact — refuse the tag
      - run: git diff --exit-code

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.man.outputs.tag }}"
          gh release create "$tag" \
            --title "${{ steps.man.outputs.title }}" \
            --generate-notes \
            release/closure-ui.js \
            "release/closure-ui-$tag.js" \
            release/closure-ui.min.js \
            "release/closure-ui-min-$tag.js" \
            release/closure-ui.md \
            "release/closure-ui-$tag.md" \
            release/checksums.txt \
            release/release-info.txt

      # The npm package was staged by the release build (release/npm:
      # bundle pair + composed README + LICENSE + package.json born from
      # the manifest). Publishing it reaches npm/pnpm/yarn/bun/Deno and
      # the unpkg/jsDelivr CDNs in one shot.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # the ./ prefix is load-bearing: a bare release/npm reads as a
      # GitHub owner/repo shorthand, not a folder
      - run: npm publish ./release/npm --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
